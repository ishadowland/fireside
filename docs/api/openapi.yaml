openapi: 3.0.3
info:
  title: Fireside API
  version: 0.3.0
  description: 'Fireside — async-first roundtable platform. Sprint 1 surface: health, stub-code login, JWT-protected rooms
    CRUD-lite, room messages (create + list with cursor pagination), and the local-only test dashboard.'
servers:
- url: http://localhost:18080
  description: local dev (default port, ADR-0004)
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: healthz
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - status
              example:
                status: ok
  /v1/auth/login:
    post:
      summary: Login with phone + SMS code (stub)
      operationId: login
      description: 'Sprint 0/1 uses a stub code (SMS_STUB_CODE, default "1234"). Unknown phones are auto-registered on first
        login. Returns a JWT to be presented inside the WebSocket auth.hello frame.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: E.164 phone number, e.g. +8613800138000
                code:
                  type: string
                  description: Stub SMS code (SMS_STUB_CODE, default "1234")
                  example: '1234'
              required:
              - phone
              - code
            examples:
              stub-login:
                value:
                  phone: '+8613800138000'
                  code: '1234'
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: HS256 JWT; present in WS auth.hello
                  expires_in:
                    type: integer
                    description: Access-token TTL in seconds (900 = 15 min)
                required:
                - token
                - expires_in
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                expires_in: 900
        '400':
          description: Malformed body (missing fields, non-E.164 phone)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_request
        '401':
          description: Wrong SMS code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid_credentials
        '500':
          description: User resolution or token signing failed (e.g. DB down)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: internal_error
  /v1/dashboard/config:
    get:
      summary: Dashboard bootstrap config (loopback-only)
      operationId: dashboardConfig
      description: 'Serves the stub SMS code so the embedded dashboard can auto-login. Only reachable from 127.0.0.1 / ::1
        (ADR-0019); other clients get 404.

        '
      responses:
        '200':
          description: Bootstrap values
          content:
            application/json:
              schema:
                type: object
                properties:
                  stub_code:
                    type: string
                    description: SMS_STUB_CODE from server config
                required:
                - stub_code
              example:
                stub_code: '1234'
        '404':
          description: Non-loopback client (deliberate; hides the route)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /dashboard/:
    get:
      summary: Local test dashboard (loopback-only, HTML)
      operationId: dashboardIndex
      description: 'Embedded HTML/JS page mirroring the Android app''s Sprint 0 flow (auto stub-login -> WS connect -> auth.hello
        -> auth.welcome). Loopback-only per ADR-0019.

        '
      responses:
        '200':
          description: Dashboard HTML page
          content:
            text/html:
              schema:
                type: string
  /dashboard/static/{file}:
    get:
      summary: Dashboard static asset (loopback-only)
      operationId: dashboardStatic
      parameters:
      - name: file
        in: path
        required: true
        schema:
          type: string
          enum:
          - app.js
          - style.css
        description: Asset name under internal/dashboard/assets/
      responses:
        '200':
          description: Asset content
          content:
            application/javascript: {}
            text/css: {}
        '404':
          description: Unknown asset or non-loopback client
  /ws/v1/connect:
    get:
      summary: WebSocket upgrade (first-frame auth)
      operationId: wsConnect
      description: 'Upgrades to a WebSocket. The client MUST send {"type":"auth.hello","token":"<jwt>"} as its first frame
        within 5s. On success the server replies auth.welcome; on failure it sends auth.error then closes with code 1008 (ADR-0007).
        Full frame spec in docs/design/03-protocol.md.

        '
      responses:
        '101':
          description: Switching Protocols; subsequent frames per the WS spec
        '400':
          description: Not a WebSocket upgrade request
          content:
            text/plain:
              schema:
                type: string
  /v1/rooms:
    post:
      summary: Create a new room (host becomes owner)
      operationId: createRoom
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoomRequest'
      responses:
        '200':
          description: Room created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRoomResponse'
        '400':
          description: Invalid request body
        '401':
          description: Missing or invalid JWT
    get:
      summary: List active rooms (lobby)
      operationId: listActiveRooms
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
        required: false
      responses:
        '200':
          description: Active rooms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListActiveRoomsResponse'
        '401':
          description: Missing or invalid JWT
  /v1/rooms/{id}:
    get:
      summary: Get room details + on-stage participants
      operationId: getRoom
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Room + participants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRoomResponse'
        '401':
          description: Missing or invalid JWT
        '404':
          description: Room not found
  /v1/rooms/{id}/end:
    post:
      summary: End a room (host only)
      operationId: endRoom
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Room ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndRoomResponse'
        '401':
          description: Missing or invalid JWT
        '403':
          description: Caller is not the host
        '404':
          description: Room not found
        '409':
          description: Room already ended
  /v1/rooms/{id}/messages:
    post:
      summary: Post a message to a room (caller must be on_stage)
      operationId: createMessage
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '200':
          description: Message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateMessageResponse'
        '400':
          description: Invalid request body
        '401':
          description: Missing or invalid JWT
        '403':
          description: Caller is not on_stage in this room
        '404':
          description: Room not found or ended
    get:
      summary: List messages in a room (cursor pagination via ?since)
      operationId: listMessages
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: since
        schema:
          type: string
        required: false
        description: Message id cursor; returns messages with id < since. Omit for the first page.
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
        required: false
        description: Default 50, max 200.
      responses:
        '200':
          description: Messages (newest first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMessagesResponse'
        '401':
          description: Missing or invalid JWT
        '404':
          description: Room not found
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code
      required:
      - error
    AuthHello:
      type: object
      properties:
        type:
          type: string
          const: auth.hello
        token:
          type: string
          description: JWT from POST /v1/auth/login
      required:
      - type
      - token
      description: Client -> server, first frame
    AuthWelcome:
      type: object
      properties:
        type:
          type: string
          const: auth.welcome
        user_id:
          type: string
          description: 26-char ULID (ADR-0014)
          example: 01HXYZABCDEFGHJKMNPQRSTVWXZ
        jti:
          type: string
        server_time:
          type: integer
          format: int64
      required:
      - type
      - user_id
      - jti
      - server_time
      description: Server -> client on successful auth
    AuthError:
      type: object
      properties:
        type:
          type: string
          const: auth.error
        code:
          type: string
          enum:
          - invalid_token
          - hello_timeout
          - bad_frame
          - internal_error
        error:
          type: string
      required:
      - type
      - code
      - error
      description: Server -> client before close on failed auth
    Room:
      type: object
      properties:
        id:
          type: string
          description: ULID
        host_user_id:
          type: string
          description: ULID of host user
        name:
          type: string
          maxLength: 128
        max_participants:
          type: integer
          minimum: 1
          maximum: 50
        keep_messages_on_end:
          type: boolean
        status:
          type: string
          enum:
          - active
          - ended
        announcement:
          type: string
          maxLength: 500
        created_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - host_user_id
      - name
      - max_participants
      - keep_messages_on_end
      - status
      - announcement
      - created_at
    Participant:
      type: object
      properties:
        id:
          type: string
        room_id:
          type: string
        user_id:
          type: string
        stage_state:
          type: string
          enum:
          - on_stage
          - off_stage
        joined_at:
          type: string
          format: date-time
        left_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - room_id
      - user_id
      - stage_state
      - joined_at
    CreateRoomRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        max_participants:
          type: integer
          minimum: 1
          maximum: 50
          default: 8
        keep_messages_on_end:
          type: boolean
          default: false
      required:
      - name
      - max_participants
    CreateRoomResponse:
      type: object
      properties:
        room:
          $ref: '#/components/schemas/Room'
      required:
      - room
    ListActiveRoomsResponse:
      type: object
      properties:
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/Room'
      required:
      - rooms
    GetRoomResponse:
      type: object
      properties:
        room:
          $ref: '#/components/schemas/Room'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
      required:
      - room
      - participants
    EndRoomResponse:
      type: object
      properties:
        room_id:
          type: string
        status:
          type: string
          enum:
          - ended
      required:
      - room_id
      - status
    Message:
      type: object
      properties:
        id:
          type: string
          description: ULID
        room_id:
          type: string
        sender_kind:
          type: string
          enum:
          - human
          - agent
          - system
        sender_id:
          type: string
          nullable: true
          description: NULL for system messages
        content_type:
          type: string
          enum:
          - text
          - system
          - image
          - question
          - answer
          - progress
        content:
          type: string
          maxLength: 8192
        mentions:
          type: array
          items:
            type: string
          description: 'Mentioned participant IDs (ULID). Sprint 1: always empty [].'
        reply_to_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - room_id
      - sender_kind
      - sender_id
      - content_type
      - content
      - mentions
      - created_at
    CreateMessageRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 8192
        reply_to_id:
          type: string
      required:
      - content
    CreateMessageResponse:
      type: object
      properties:
        message:
          $ref: '#/components/schemas/Message'
      required:
      - message
    ListMessagesResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        next_before:
          type: string
          description: Cursor for next page; empty string means no more pages.
      required:
      - messages
      - next_before
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'HS256 JWT obtained from POST /v1/auth/login. Required on every /v1/rooms/* route. Authorization: Bearer
        <token>.'
