version: "2"
sql:
  # Engine + DB for local codegen. Mirrors `.env.example`'s POSTGRES_DSN.
  - engine: "postgresql"
    queries: "db/queries"
    schema: "db/migrations"
    gen:
      go:
        package: "store"
        out: "internal/store"
        sql_package: "database/sql"
        emit_json_tags: false
        emit_interface: true
        emit_prepared_queries: false
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"