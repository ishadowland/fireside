version: "2"

# golangci-lint config for Fireside. Sprint 0 keeps this lean — only the
# linters that catch real bugs in our wiring code. Sprint 1+ can add
# style / complexity linters once the codebase grows.
#
# v2 schema reference: https://golangci-lint.run/product/migration-guide/

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck       # unchecked errors → silent failures (mandated by docs/design/02-modules.md)
    - govet          # standard go vet
    - ineffassign    # unused assignments
    - staticcheck    # broad static analysis (covers unused, printf format, etc.)
    - unused         # unused vars / funcs / types
  settings:
    errcheck:
      # Allow unchecked errors in test files for now; tighten in Sprint 1+
      # once SUB-001 / SUB-003 establish test conventions.
      check-blank: true
      exclude-functions:
        - fmt.Fprintf
        - fmt.Printf

issues:
  # Don't fail CI on the first week of Sprint 0 — let sub-contractors
  # land their PRs and we'll iterate. Sprint 1 sets max-same-issues: 0.
  max-same-issues: 50
  exclusions:
    # Generated files by sqlc — DO NOT lint, DO NOT fix by hand.
    - path: "internal/store/.*\\.go"
      linters:
        - errcheck
        - govet
        - ineffassign
        - staticcheck
        - unused