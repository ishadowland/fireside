name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fireside
          POSTGRES_USER: fireside
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fireside -d fireside"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_DSN: postgres://fireside:devpassword@localhost:5432/fireside?sslmode=disable
      JWT_SECRET: ci-test-secret-not-for-production
      JWT_ACCESS_TTL_MIN: "15"
      LOG_LEVEL: info
      PORT: "8080"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: true

      - name: Install sqlc
        # Sprint 1 tech-debt fix (issue #16 L-1): pin to v1.27.0.
        # `go install @latest` resolves to v1.31+ which requires Go
        # 1.26+; CI is pinned to Go 1.22. The version mismatch silently
        # switches the runtime to go1.26.5 and breaks subsequent steps
        # whose shell-level Go is the explicit 1.22 toolchain.
        # v1.27.0 is the last release that works with Go 1.22.
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.27.0

      - name: Install golang-migrate
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz \
            | tar -xz -C /tmp
          sudo mv /tmp/migrate /usr/local/bin/migrate

      - name: sqlc verify (generated code matches queries)
        run: sqlc vet

      - name: Migrations up
        # migrate is installed to /usr/local/bin and there is no .env in CI,
        # so invoke the binary directly instead of going through `make`.
        run: migrate -path db/migrations -database "$POSTGRES_DSN" up

      - name: Migrations down (round-trip)
        run: migrate -path db/migrations -database "$POSTGRES_DSN" down 1

      - name: Integration test DB setup
        # Sprint 1 integration tests (internal/rooms, internal/messages,
        # internal/participants) require a real Postgres test DB. Without
        # this, the per-test FIRESIDE_TEST_DSN guard skips them and the CI
        # gate is silent on issues like WP-2 CHAR(26) trailing-space,
        # WP-3 errors.Is mismatch, WP-4 SQLSTATE 42P08.
        #
        # Steps:
        # 1. Create a fresh `fireside_test` database (separate from the
        #    main `fireside` DB so concurrent truncate doesn't blow up
        #    the dev DB).
        # 2. Run all migrations on it.
        env:
          POSTGRES_DSN_TEST: postgres://fireside:devpassword@localhost:5432/fireside_test?sslmode=disable
        run: |
          psql "postgres://fireside:devpassword@localhost:5432/postgres?sslmode=disable" \
            -c "DROP DATABASE IF EXISTS fireside_test;" \
            -c "CREATE DATABASE fireside_test;"
          migrate -path db/migrations -database "$POSTGRES_DSN_TEST" up

      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go build
        run: go build ./...

      - name: go test (unit + integration, parallel — per-package DB isolation)
        # Sprint 1 tech-debt fix (issue #16 L-2): each integration
        # suite uses its own database (fireside_test_rooms,
        # fireside_test_messages, fireside_test_participants). The
        # per-package DBs are provisioned automatically by
        # internal/testutil via pg_dump + psql through the postgres
        # service. Because the suites no longer share a DB, the
        # three integration suites can run in parallel under the
        # default `go test ./...` parallelism. -count=1 disables
        # test caching. -race runs the data race detector.
        env:
          FIRESIDE_TEST_DSN: postgres://fireside:devpassword@localhost:5432/fireside_test?sslmode=disable
        run: go test -race -count=1 ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.0.0  # .golangci.yml uses v2 schema
